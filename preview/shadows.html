<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Shadows & Elevation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:30px; background:#FDF0F7; font-family: var(--font-body); }
  .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:28px; }
  .demo { background:#fff; border: var(--border-bold); border-radius: 14px; height:76px; display:flex; align-items:center; justify-content:center; font-weight:900; text-transform:uppercase; font-size:11px; letter-spacing:.1em; color:var(--ugt-ink); }
  .cap { font-family: ui-monospace, monospace; font-size:10px; color:var(--ugt-ink-muted); text-align:center; margin-top:10px; }
</style></head><body>
<div class="grid">
  <div><div class="demo" style="box-shadow: 3px 3px 0 #1A1A1A;">XS</div><div class="cap">sticker-xs</div></div>
  <div><div class="demo" style="box-shadow: 6px 6px 0 #1A1A1A;">Ink</div><div class="cap">sticker-ink</div></div>
  <div><div class="demo" style="box-shadow: 6px 6px 0 #C7238E;">Magenta</div><div class="cap">sticker-magenta</div></div>
  <div><div class="demo" style="box-shadow: 6px 6px 0 #F5A623;">Orange</div><div class="cap">sticker-orange</div></div>
  <div><div class="demo" style="box-shadow: 10px 10px 0 #1A1A1A;">Large</div><div class="cap">sticker-lg</div></div>
  <div><div class="demo" style="box-shadow: 0 10px 30px rgba(199,35,142,.25); border:none;">Soft</div><div class="cap">soft</div></div>
  <div><div class="demo" style="background:#1A1A1A; color:#fff; border:none; box-shadow: 0 0 40px rgba(199,35,142,.7);">Glow ⚡</div><div class="cap">glow-magenta</div></div>
  <div><div class="demo" style="background:#1A1A1A; color:#fff; border:none; box-shadow: 0 0 40px rgba(245,166,35,.7);">Glow ⚡</div><div class="cap">glow-orange</div></div>
</div>
</body></html>

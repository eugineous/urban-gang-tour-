<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Form Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:#fff; font-family: var(--font-body); }
  .field { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; max-width:420px; }
  label { font-weight:900; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ugt-ink); }
  input, select, textarea { font-family: var(--font-body); font-size:16px; padding:12px 14px; border: 3px solid #1A1A1A; border-radius: 10px; background:#fff; color:#1A1A1A; box-shadow: 3px 3px 0 #1A1A1A; }
  input:focus, select:focus, textarea:focus { outline: 3px solid var(--ugt-orange); outline-offset: 2px; }
  .hint { font-size:12px; color:var(--ugt-ink-muted); }
  .row { display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
</style></head><body>
<div class="row">
  <div class="field">
    <label>School Name</label>
    <input type="text" value="Senior Chief Koinange Girls" />
  </div>
  <div class="field">
    <label>Event Date</label>
    <input type="text" value="30 May 2026" />
  </div>
</div>
<div class="field">
  <label>Your Role</label>
  <select><option>Principal · Deputy · Teacher</option><option>Student Leader</option><option>Sponsor / Partner</option></select>
</div>
<div class="field">
  <label>Why UGT at your school?</label>
  <textarea rows="2" placeholder="Tell us your story…"></textarea>
  <div class="hint">No character limit. We read every one.</div>
</div>
</body></html>

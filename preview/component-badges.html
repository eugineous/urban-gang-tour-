<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Chips & Badges</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:22px; background:#fff; font-family: var(--font-body); }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .lbl { font-weight:800; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ugt-magenta); margin-bottom:6px; }
  .chip { display:inline-flex; align-items:center; gap:6px; font-weight:800; font-size:12px; letter-spacing:.08em; text-transform:uppercase; padding:6px 12px; border-radius: 999px; border: 2px solid #1A1A1A; }
  .c-solid { background: #C7238E; color:#fff; }
  .c-orange { background: #F5A623; color:#1A1A1A; }
  .c-ink { background: #1A1A1A; color:#fff; }
  .c-ghost { background: #fff; color:#1A1A1A; }
  .c-church { background: #7B1FA2; color:#fff; border-color:#7B1FA2; }
  .c-green { background: #2E7D32; color:#fff; border-color:#2E7D32; }
  .tier { display:inline-flex; gap:6px; align-items:center; font-weight:900; font-size:13px; text-transform:uppercase; padding:8px 14px; border-radius:10px; border: 3px solid #1A1A1A; box-shadow: 3px 3px 0 #1A1A1A; background:#fff; }
</style></head><body>
<div class="lbl">Status chips</div>
<div class="row">
  <span class="chip c-solid">Live</span>
  <span class="chip c-orange">New</span>
  <span class="chip c-ink">On Air</span>
  <span class="chip c-ghost">Booked</span>
  <span class="chip c-church">DLC Session</span>
  <span class="chip c-green">Tree Planting</span>
</div>
<div class="lbl">Sponsor tiers</div>
<div class="row">
  <span class="tier">⭐ Presenting</span>
  <span class="tier">🏆 Impact</span>
  <span class="tier">💡 Category</span>
  <span class="tier">🌱 Community</span>
</div>
</body></html>

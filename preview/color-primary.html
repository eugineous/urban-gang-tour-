<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Primary Colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background:#fff; font-family: var(--font-body); }
  .row { display:grid; grid-template-columns: repeat(6, 1fr); gap:12px; }
  .sw { border: var(--border-bold); border-radius: var(--r-md); box-shadow: var(--shadow-sticker-xs); overflow:hidden; }
  .chip { height: 84px; display:flex; align-items:flex-end; padding:10px; }
  .meta { padding:10px 12px; background:#fff; border-top: var(--border-thin); }
  .name { font-weight:900; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--ugt-ink); }
  .hex { font-family: ui-monospace, monospace; font-size:12px; color:var(--ugt-ink-muted); margin-top:2px; }
  .lbl { font-family: var(--font-body); font-weight:800; font-size:10px; letter-spacing:.12em; text-transform:uppercase; }
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#C7238E;"><span class="lbl" style="color:#fff">PRIMARY</span></div><div class="meta"><div class="name">Magenta</div><div class="hex">#C7238E</div></div></div>
  <div class="sw"><div class="chip" style="background:#F5A623;"><span class="lbl" style="color:#1A1A1A">SECONDARY</span></div><div class="meta"><div class="name">Orange</div><div class="hex">#F5A623</div></div></div>
  <div class="sw"><div class="chip" style="background:#1A1A1A;"><span class="lbl" style="color:#fff">INK</span></div><div class="meta"><div class="name">Ink</div><div class="hex">#1A1A1A</div></div></div>
  <div class="sw"><div class="chip" style="background:#FFFFFF; border-bottom: 1px solid #eee;"><span class="lbl" style="color:#1A1A1A">WHITE</span></div><div class="meta"><div class="name">White</div><div class="hex">#FFFFFF</div></div></div>
  <div class="sw"><div class="chip" style="background:#FDF0F7;"><span class="lbl" style="color:#C7238E">TINT</span></div><div class="meta"><div class="name">Magenta Soft</div><div class="hex">#FDF0F7</div></div></div>
  <div class="sw"><div class="chip" style="background:#FFF8ED;"><span class="lbl" style="color:#D98A08">TINT</span></div><div class="meta"><div class="name">Orange Soft</div><div class="hex">#FFF8ED</div></div></div>
</div>
</body></html>

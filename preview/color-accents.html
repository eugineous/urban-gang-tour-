<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Accent Colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background:#fff; font-family: var(--font-body); }
  .grid { display:grid; grid-template-columns: repeat(5, 1fr); gap:12px; }
  .sw { border: var(--border-bold); border-radius: var(--r-md); overflow:hidden; box-shadow: var(--shadow-sticker-xs); }
  .chip { height: 70px; display:flex; align-items:flex-end; padding:8px; }
  .meta { padding:8px 10px; background:#fff; border-top: var(--border-thin); }
  .name { font-weight:900; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--ugt-ink); }
  .hex { font-family: ui-monospace, monospace; font-size:10px; color:var(--ugt-ink-muted); margin-top:2px; }
  .use { font-size:10px; color:var(--ugt-ink-muted); margin-top:2px; }
  .lbl { font-weight:800; font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:#fff; }
</style></head><body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#9E1A6F;"><span class="lbl">DEEP</span></div><div class="meta"><div class="name">Magenta Deep</div><div class="hex">#9E1A6F</div><div class="use">Pressed · shadow side</div></div></div>
  <div class="sw"><div class="chip" style="background:#D98A08;"><span class="lbl">DEEP</span></div><div class="meta"><div class="name">Orange Deep</div><div class="hex">#D98A08</div><div class="use">Hover / extrude</div></div></div>
  <div class="sw"><div class="chip" style="background:#7B1FA2;"><span class="lbl">CHURCH</span></div><div class="meta"><div class="name">Church Purple</div><div class="hex">#7B1FA2</div><div class="use">DLC segments</div></div></div>
  <div class="sw"><div class="chip" style="background:#2E7D32;"><span class="lbl">GREEN</span></div><div class="meta"><div class="name">Movement Green</div><div class="hex">#2E7D32</div><div class="use">Tree planting</div></div></div>
  <div class="sw"><div class="chip" style="background:#1E40AF;"><span class="lbl">PPP TV</span></div><div class="meta"><div class="name">Broadcast Blue</div><div class="hex">#1E40AF</div><div class="use">PPP TV lower-thirds</div></div></div>
</div>
</body></html>

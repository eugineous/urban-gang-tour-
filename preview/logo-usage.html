<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Logo Lockup</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family: var(--font-body); display:grid; grid-template-columns: 1fr 1fr; }
  .cell { padding:24px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; min-height:220px; }
  .light { background: #fff; }
  .dark { background: #1A1A1A; }
  .mag { background: #C7238E; }
  .orange { background: #F5A623; }
  img { width: 180px; height: auto; filter: drop-shadow(0 6px 12px rgba(0,0,0,.15)); }
  .cap { font-weight:900; font-size:10px; letter-spacing:.14em; text-transform:uppercase; }
  .light .cap, .orange .cap { color:var(--ugt-magenta); }
  .dark .cap, .mag .cap { color:#fff; }
</style></head><body>
<div class="cell light"><img src="../assets/logos/ugt-logo-full.png" alt=""><div class="cap">On White · primary</div></div>
<div class="cell dark"><img src="../assets/logos/ugt-logo-full.png" alt=""><div class="cap">On Ink · concert mode</div></div>
<div class="cell mag"><img src="../assets/logos/ugt-logo-full.png" alt=""><div class="cap">On Magenta · poster</div></div>
<div class="cell orange"><img src="../assets/logos/ugt-logo-full.png" alt=""><div class="cap">On Orange · accent</div></div>
</body></html>

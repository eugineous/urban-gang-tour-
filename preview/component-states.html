<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Interaction States</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:#FDF0F7; font-family: var(--font-body); }
  .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:18px; }
  .btn { font-weight:900; font-size:14px; letter-spacing:.08em; text-transform:uppercase; padding:12px 18px; border: 3px solid #1A1A1A; border-radius: 999px; background: var(--ugt-magenta); color:#fff; text-align:center; }
  .rest { box-shadow: 6px 6px 0 #1A1A1A; }
  .hover { box-shadow: 3px 3px 0 #1A1A1A; transform: translate(3px, 3px); }
  .press { box-shadow: none; transform: translate(6px, 6px); }
  .focus { box-shadow: 6px 6px 0 #1A1A1A; outline: 3px solid #F5A623; outline-offset: 3px; }
  .cap { text-align:center; font-weight:800; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color: var(--ugt-magenta); margin-top: 14px; }
</style></head><body>
<div class="grid">
  <div><div class="btn rest">Rest</div><div class="cap">default</div></div>
  <div><div class="btn hover">Hover</div><div class="cap">shift +3 into shadow</div></div>
  <div><div class="btn press">Press</div><div class="cap">flatten · stamp</div></div>
  <div><div class="btn focus">Focus</div><div class="cap">orange ring · 3px</div></div>
</div>
</body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Display Type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:#fff; }
  .row { display:flex; flex-direction:column; gap:16px; }
  .specimen { display:flex; align-items:baseline; gap:20px; padding-bottom:12px; border-bottom: 1.5px dashed #1A1A1A; }
  .name { font-family: var(--font-body); font-weight:800; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ugt-magenta); min-width:150px; }
  .sample { flex:1; }
  .meta { font-family: ui-monospace, monospace; font-size:10px; color:var(--ugt-ink-muted); }
</style></head><body>
<div class="row">
  <div class="specimen">
    <div class="name">Display / Anton</div>
    <div class="sample">
      <div style="font-family: var(--font-display); font-size:68px; line-height:.92; letter-spacing:-.02em; text-transform:uppercase; color:var(--ugt-ink);">From Potential</div>
      <div class="meta">Anton · 64–160px · uppercase · -0.02em</div>
    </div>
  </div>
  <div class="specimen">
    <div class="name">Display / Archivo Black</div>
    <div class="sample">
      <div style="font-family: var(--font-display-alt); font-size:52px; line-height:1; text-transform:uppercase; color:var(--ugt-magenta);">Bookings Open</div>
      <div class="meta">Archivo Black · 40–80px · uppercase</div>
    </div>
  </div>
  <div class="specimen">
    <div class="name">Graffiti / Bangers</div>
    <div class="sample">
      <div style="font-family: var(--font-graffiti); font-size:58px; line-height:1; letter-spacing:.04em; color:var(--ugt-orange);">2ND TERM CALENDAR</div>
      <div class="meta">Bangers · 36–72px · 0.04em tracking</div>
    </div>
  </div>
</div>
</body></html>

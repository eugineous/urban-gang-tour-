<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Type Treatments</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:#C7238E; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:18px; }
  .demo { background:#fff; border: var(--border-bold); border-radius: var(--r-md); padding:18px; box-shadow: var(--shadow-sticker-xs); }
  .lbl { font-family: var(--font-body); font-weight:800; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ugt-magenta); margin-bottom:10px; }
  .big { font-family: var(--font-display); font-size:38px; line-height:1; text-transform:uppercase; color:var(--ugt-ink); letter-spacing:-0.02em; }
</style></head><body>
<div class="grid">
  <div class="demo">
    <div class="lbl">Yellow Highlight</div>
    <div class="big">Bookings <span class="ugt-highlight">still open</span></div>
  </div>
  <div class="demo">
    <div class="lbl">Gradient Text</div>
    <div class="big"><span class="ugt-grad-text">From Potential</span></div>
  </div>
  <div class="demo">
    <div class="lbl">Slash Underline</div>
    <div class="big"><span class="ugt-slash-underline">On Tour</span></div>
  </div>
  <div class="demo">
    <div class="lbl">Mixed Case · Graffiti</div>
    <div style="font-family: var(--font-graffiti); font-size:38px; color:var(--ugt-orange); text-transform:uppercase; letter-spacing:.04em;">2<span style="color:#1A1A1A;">nd</span> Term</div>
  </div>
</div>
</body></html>

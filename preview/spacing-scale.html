<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Spacing Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background:#fff; font-family: var(--font-body); }
  .row { display:flex; align-items:center; gap:14px; padding:6px 0; border-bottom: 1px solid #f2f2f2; }
  .tag { width:48px; font-weight:900; font-size:11px; color:var(--ugt-magenta); }
  .bar { background: var(--ugt-magenta); height: 12px; border-radius: 2px; }
  .val { width:60px; font-family: ui-monospace, monospace; font-size:11px; color:var(--ugt-ink-muted); text-align:right; }
  .use { font-size:11px; color:var(--ugt-ink-muted); flex:1; }
</style></head><body>
<div class="row"><div class="tag">s-1</div><div class="bar" style="width:4px;"></div><div class="val">4px</div><div class="use">hairline gap</div></div>
<div class="row"><div class="tag">s-2</div><div class="bar" style="width:8px;"></div><div class="val">8px</div><div class="use">tight stack</div></div>
<div class="row"><div class="tag">s-3</div><div class="bar" style="width:12px;"></div><div class="val">12px</div><div class="use">chip padding-y</div></div>
<div class="row"><div class="tag">s-4</div><div class="bar" style="width:16px;"></div><div class="val">16px</div><div class="use">card padding</div></div>
<div class="row"><div class="tag">s-6</div><div class="bar" style="width:24px;"></div><div class="val">24px</div><div class="use">default gutter</div></div>
<div class="row"><div class="tag">s-8</div><div class="bar" style="width:32px;"></div><div class="val">32px</div><div class="use">section inner</div></div>
<div class="row"><div class="tag">s-12</div><div class="bar" style="width:48px;"></div><div class="val">48px</div><div class="use">between blocks</div></div>
<div class="row"><div class="tag">s-20</div><div class="bar" style="width:80px;"></div><div class="val">80px</div><div class="use">section outer</div></div>
<div class="row"><div class="tag">s-32</div><div class="bar" style="width:128px;"></div><div class="val">128px</div><div class="use">hero breathing</div></div>
</body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:#FDF0F7; font-family: var(--font-body); }
  .row { display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .btn { font-family: var(--font-body); font-weight:900; font-size:14px; letter-spacing:.08em; text-transform:uppercase; padding:12px 20px; border: 3px solid #1A1A1A; border-radius: 999px; cursor:pointer; transition: all 180ms cubic-bezier(0.22,1,0.36,1); }
  .btn-primary { background: var(--ugt-magenta); color:#fff; box-shadow: 6px 6px 0 #1A1A1A; }
  .btn-secondary { background: var(--ugt-orange); color:#1A1A1A; box-shadow: 6px 6px 0 #1A1A1A; }
  .btn-ghost { background: #fff; color:#1A1A1A; box-shadow: 6px 6px 0 #C7238E; }
  .btn-dark { background: #1A1A1A; color:#fff; box-shadow: 6px 6px 0 #F5A623; }
  .btn-lg { font-size:18px; padding:16px 28px; }
  .btn-sm { font-size:12px; padding:8px 14px; border-width:2px; box-shadow: 4px 4px 0 #1A1A1A; }
  .lbl { font-weight:800; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ugt-magenta); margin-bottom:8px; }
</style></head><body>
<div class="lbl">Primary · Secondary · Ghost · Dark</div>
<div class="row">
  <button class="btn btn-primary">Apply Now</button>
  <button class="btn btn-secondary">Bookings Open</button>
  <button class="btn btn-ghost">See Calendar</button>
  <button class="btn btn-dark">Watch on PPP TV</button>
</div>
<div class="lbl">Sizes</div>
<div class="row">
  <button class="btn btn-primary btn-lg">Book Your School</button>
  <button class="btn btn-primary">Sponsor UGT</button>
  <button class="btn btn-primary btn-sm">Details</button>
</div>
</body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Signature Motifs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:#C7238E; font-family: var(--font-body); }
  .grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:14px; }
  .tile { background:#fff; border:3px solid #1A1A1A; border-radius:12px; padding:14px; height:110px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
  .cap { position:absolute; bottom:6px; left:10px; font-weight:800; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ugt-magenta); }
  .stroke { position:absolute; inset:0; background:
      radial-gradient(ellipse 120px 20px at 30% 40%, rgba(255,255,255,.9), transparent 60%),
      radial-gradient(ellipse 80px 15px at 70% 70%, rgba(255,255,255,.75), transparent 60%);
  }
  .dashed { border-style:dashed; border-width:3px; }
  .xrow { font-family: var(--font-body); font-weight:900; letter-spacing:.18em; color:var(--ugt-ink); font-size:14px; }
  .tape::before { content:''; position:absolute; top:-10px; left:30%; width:72px; height:22px; background: rgba(245,166,35,.8); transform: rotate(-5deg); border-radius:2px; }
  .tape::after { content:''; position:absolute; bottom:-8px; right:20%; width:48px; height:18px; background: rgba(199,35,142,.35); transform: rotate(7deg); border-radius:2px; }
  .slash { background: repeating-linear-gradient(-45deg, #1A1A1A 0 8px, transparent 8px 16px); width:72px; height:26px; }
  .teardrop { width:44px; height:64px; background: var(--ugt-magenta); border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; border: 3px solid #1A1A1A; position:relative; }
  .teardrop::after { content:''; position:absolute; left:50%; bottom:-16px; transform: translateX(-50%); width: 8px; height: 28px; background: #1A1A1A; border-radius: 0 0 4px 4px; }
  .arrow { width:90px; height:46px; }
</style></head><body>
<div class="grid">
  <div class="tile"><div class="stroke"></div><div class="cap">Paint Strokes</div></div>
  <div class="tile dashed"><span class="xrow">X X X X X X X X</span><div class="cap">Dashed Frame</div></div>
  <div class="tile tape"><div style="font-family: var(--font-handwritten); font-size:28px;">Sticker!</div><div class="cap">Tape Corners</div></div>
  <div class="tile"><div class="slash"></div><div class="cap">Slash Bar</div></div>
  <div class="tile"><div class="teardrop"></div><div class="cap">Teardrop Banner</div></div>
  <div class="tile">
    <svg class="arrow" viewBox="0 0 90 46"><path d="M8 40 C 20 6, 55 6, 80 20" stroke="#1A1A1A" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M70 14 L82 20 L72 28" stroke="#1A1A1A" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="cap">Hand Arrow</div>
  </div>
</div>
</body></html>

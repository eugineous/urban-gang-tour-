<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Color Pairings</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background:#fff; font-family: var(--font-body); }
  .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; }
  .pair { border: var(--border-bold); border-radius: var(--r-md); overflow:hidden; box-shadow: var(--shadow-sticker-xs); }
  .demo { height: 90px; display:flex; align-items:center; justify-content:center; padding:10px; text-align:center; font-family: var(--font-display); text-transform:uppercase; font-size:26px; line-height:1; letter-spacing:-0.01em; }
  .cap { padding:8px 10px; background:#fff; border-top: var(--border-thin); font-size:11px; color:var(--ugt-ink-muted); font-weight:600; }
</style></head><body>
<div class="grid">
  <div class="pair"><div class="demo" style="background:#C7238E; color:#fff;">From Potential</div><div class="cap">White on Magenta · AA</div></div>
  <div class="pair"><div class="demo" style="background:#1A1A1A; color:#C7238E;">To Purpose</div><div class="cap">Magenta on Ink · AA</div></div>
  <div class="pair"><div class="demo" style="background:#FDF0F7; color:#9E1A6F;">Bookings Open</div><div class="cap">Deep Magenta on Soft</div></div>
  <div class="pair"><div class="demo" style="background:#1A1A1A; color:#F5A623;">Urban Gang</div><div class="cap">Orange on Ink · AA</div></div>
</div>
</body></html>

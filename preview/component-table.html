<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Tables</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background:#fff; font-family: var(--font-body); }
  table { width:100%; border-collapse: collapse; border: 3px solid #1A1A1A; border-radius: 12px; overflow:hidden; }
  thead { background: #C7238E; color:#fff; }
  th { text-align:left; padding: 10px 14px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; font-weight:900; }
  td { padding: 10px 14px; font-size:13px; color:#1A1A1A; border-top: 1.5px solid #F1D7E6; }
  tr:nth-child(even) { background: #FDF0F7; }
  .time { font-weight:900; color: var(--ugt-magenta); font-family: ui-monospace, monospace; font-size:12px; }
</style></head><body>
<table>
  <thead><tr><th>Time</th><th>Segment</th><th>Lead</th></tr></thead>
  <tbody>
    <tr><td class="time">8:10</td><td>Urban Pods · 5 breakouts</td><td>All pros</td></tr>
    <tr><td class="time">9:20</td><td>Tree Planting</td><td>Tai · Green Movement</td></tr>
    <tr><td class="time">10:00</td><td>Church Opening · Tribez</td><td>DLC</td></tr>
    <tr><td class="time">10:55</td><td>Choir Performance</td><td>Student choir</td></tr>
    <tr><td class="time">2:30</td><td>Curtain Raiser · Guest #1</td><td>DJ Xavi</td></tr>
    <tr><td class="time">5:10</td><td>Headline Act</td><td>Guest #2</td></tr>
  </tbody>
</table>
</body></html>

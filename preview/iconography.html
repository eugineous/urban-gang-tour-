<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background:#fff; font-family: var(--font-body); }
  .lbl { font-weight:800; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ugt-magenta); margin-bottom:8px; }
  .row { display:flex; gap:18px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  .ic { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .ic svg { width:28px; height:28px; stroke:#1A1A1A; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .ic span { font-size:10px; color: var(--ugt-ink-muted); }
  .emoji { font-size:26px; }
</style></head><body>
<div class="lbl">Lucide (CDN, 2px stroke)</div>
<div class="row">
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 1a4 4 0 0 0-4 4v6a4 4 0 0 0 8 0V5a4 4 0 0 0-4-4z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4M8 22h8"/></svg><span>mic</span></div>
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-6.5 4 2-7L2 9h7z"/></svg><span>star</span></div>
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M6 2l1.5 3h9L18 2M5 9h14l-1.5 13h-11z"/></svg><span>trophy</span></div>
  <div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span>clock</span></div>
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span>map-pin</span></div>
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M3 12c3 0 6-3 6-6 0 3 3 6 6 6-3 0-6 3-6 6 0-3-3-6-6-6z"/><path d="M9 6v-4M9 18v4"/></svg><span>sparkle</span></div>
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 2v8M8 6l4-4 4 4M4 14c8 6 8 6 16 0M4 14v6h16v-6"/></svg><span>tree</span></div>
  <div class="ic"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M7 2l5 4 5-4"/></svg><span>tv</span></div>
</div>
<div class="lbl">Sponsor-tier emoji (used verbatim)</div>
<div class="row">
  <div class="ic"><span class="emoji">⭐</span><span>Presenting</span></div>
  <div class="ic"><span class="emoji">🏆</span><span>Impact</span></div>
  <div class="ic"><span class="emoji">💡</span><span>Category</span></div>
  <div class="ic"><span class="emoji">🌱</span><span>Community</span></div>
</div>
</body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Type Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background:#fff; font-family: var(--font-body); }
  table { width:100%; border-collapse: collapse; }
  tr { border-bottom: 1px solid #eee; }
  td { padding:8px 10px; vertical-align:middle; }
  td.tag { width:120px; font-weight:800; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ugt-magenta); }
  td.sample { font-family: var(--font-display); text-transform:uppercase; line-height:1; color:var(--ugt-ink); letter-spacing:-0.02em; }
  td.meta { width:110px; font-family: ui-monospace, monospace; font-size:10px; color:var(--ugt-ink-muted); text-align:right; }
</style></head><body>
<table>
  <tr><td class="tag">Display XL</td><td class="sample" style="font-size:80px;">Gang</td><td class="meta">80–160 / 0.92</td></tr>
  <tr><td class="tag">Display L</td><td class="sample" style="font-size:54px;">Urban</td><td class="meta">48–96 / 0.95</td></tr>
  <tr><td class="tag">Display M</td><td class="sample" style="font-size:38px;">Tour 2026</td><td class="meta">36–64 / 1.0</td></tr>
  <tr><td class="tag">H2 · Magenta</td><td class="sample" style="font-size:28px; color:var(--ugt-magenta);">What happens on tour</td><td class="meta">28 / 1.05</td></tr>
  <tr><td class="tag">H3 · Block</td><td style="font-family: var(--font-display-alt); font-size:22px; text-transform:uppercase; color:var(--ugt-ink);">Bookings still open</td><td class="meta">22 / 1.1</td></tr>
  <tr><td class="tag">Body</td><td style="font-size:16px; color:var(--ugt-ink); line-height:1.5; font-family: var(--font-body);">From Potential to Purpose — a youth movement shot on national TV.</td><td class="meta">16 / 1.5</td></tr>
  <tr><td class="tag">Caption</td><td style="font-size:13px; color:var(--ugt-ink-muted); font-family: var(--font-body);">Urban News on PPP TV Kenya</td><td class="meta">13 / 1.4</td></tr>
</table>
</body></html>

name: Refresh public newsroom sources
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: public-news-snapshot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: urban-news-feeds
          path: source-data
      - run: python3 scripts/collect-news-feeds.py source-data/feeds.json
      - run: python3 -m pip install "Pillow==12.3.0"
      - run: python3 scripts/publish-news-edition.py source-data
        env:
          UGT_DAILY_BRIEFS: ${{ vars.UGT_DAILY_BRIEFS || '10' }}
      - run: python3 scripts/collect-news-x.py source-data
        env:
          X_BEARER_TOKEN: ${{ secrets.UGT_X_BEARER_TOKEN }}
      - working-directory: source-data
        run: |
          git add -- feeds.json latest-briefs.json archive-briefs.json
          if [ -d editions ]; then git add -- editions; fi
          if [ -d photos ]; then git add -- photos; fi
          if [ -f x-entertainment.json ]; then git add -- x-entertainment.json; fi
          if ! git diff --cached --quiet; then
            git -c user.name='Urban News sources' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh publisher metadata and chart positions'
            git push origin HEAD:urban-news-feeds
          fi
      - name: Report newsroom intake
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import collections, json
          from pathlib import Path
          stories=json.loads(Path("source-data/latest-briefs.json").read_text())
          print("## Urban News")
          print(f"{len(stories)} recent briefs in the site feed.")
          for market,count in sorted(collections.Counter(s["country"] for s in stories).items()):
              print(f"- {market}: {count}")
          PY

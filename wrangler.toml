name = "urban-gang-tour"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Persists invocation logs + traces to the dashboard for debugging.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
html_handling = "none"
run_worker_first = ["/v25-template", "/v25-template.html"]

# The existing dashboard-managed cron is */15 * * * * (UTC). Omitting
# [triggers] preserves it. Re-PUTting the identical schedule fails when the
# account is at its cron limit; routine deployments must not recreate it.

# Self-reference, used by OpenNext's queue/revalidation plumbing (ISR) to
# invoke this same Worker internally. Standard OpenNext Cloudflare
# boilerplate - see https://opennext.js.org/cloudflare.
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "urban-gang-tour"

# Durable uploads; bundled media and cache seeds use ASSETS.
[[kv_namespaces]]
binding = "UGT_MEDIA"
id = "3f75011384624e01b1da3baeed95f6b1"

[[routes]]
pattern = "urbangangtour.co.ke"
custom_domain = true

[[routes]]
pattern = "www.urbangangtour.co.ke"
custom_domain = true

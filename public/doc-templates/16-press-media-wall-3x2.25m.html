<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UGT — Press Media Wall · 3m × 2.25m</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #1a0c13; font-family: Arial, sans-serif; }
      body { min-height: 100vh; display: grid; place-items: center; padding: 34px; }
      .stage { width: 760px; }
      .wall { width: 740px; height: 555px; position: relative; overflow: hidden; border: 6px solid #1c1c1c; background: radial-gradient(circle at 50% 40%, #3f0d2b, #250a1d 74%); box-shadow: 0 24px 60px #0008; }
      .wall::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(#ffffff18 1px, transparent 1.4px); background-size: 16px 16px; }
      .safe { position: absolute; inset: 25px 25px 72px; display: grid; grid-template-columns: repeat(5, 1fr); grid-auto-rows: 1fr; align-items: center; gap: 6px 14px; }
      .mark { height: 64px; display: grid; place-items: center; }
      .mark.ugt img { width: 96px; height: auto; filter: drop-shadow(2px 3px 0 #0007); }
      .mark.ppp span { padding: 6px 10px; border-radius: 7px; background: #fff; display: flex; align-items: center; }
      .mark.ppp img { width: 53px; height: auto; }
      .mark.handle { color: #fff9; font-size: 8px; font-weight: 800; letter-spacing: .13em; }
      .bottom { position: absolute; left: 0; right: 0; bottom: 0; background: #fffdf7; color: #151117; }
      .stripe { height: 6px; background: linear-gradient(90deg, #f900b5 0 50%, #ffd523 50% 75%, #20c9e4 75%); }
      .partners { height: 50px; display: flex; align-items: center; justify-content: center; gap: 34px; }
      .partners img { height: 23px; width: auto; object-fit: contain; }
      .partners b { font-size: 8px; letter-spacing: .15em; }
      .legs { width: 740px; display: flex; justify-content: space-between; padding: 0 80px; }
      .legs span { width: 14px; height: 60px; background: linear-gradient(#4a4a4a, #222); }
      .caption { margin: 10px 0 0 18px; color: #c09aaa; font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
      @media print { body { padding: 0; background: #fff; } .wall { box-shadow: none; } }
    </style>
  </head>
  <body>
    <main class="stage">
      <section class="wall" aria-label="Urban Gang Tour press media wall">
        <div class="safe">
          <div class="mark ugt"><img src="../uploads/URBAN GANG TOUR OFFICIAL LOGO.png" alt="Urban Gang Tour" /></div><div class="mark ppp"><span><img src="../assets/partners/ppp-tv.png" alt="PPP TV" /></span></div><div class="mark ugt"><img src="../uploads/URBAN GANG TOUR OFFICIAL LOGO.png" alt="Urban Gang Tour" /></div><div class="mark handle">@URBAN_NEWSGANG</div><div class="mark ugt"><img src="../uploads/URBAN GANG TOUR OFFICIAL LOGO.png" alt="Urban Gang Tour" /></div>
          <div class="mark ppp"><span><img src="../assets/partners/ppp-tv.png" alt="PPP TV" /></span></div><div class="mark ugt"><img src="../uploads/URBAN GANG TOUR OFFICIAL LOGO.png" alt="Urban Gang Tour" /></div><div class="mark ppp"><span><img src="../assets/partners/ppp-tv.png" alt="PPP TV" /></span></div><div class="mark ugt"><img src="../uploads/URBAN GANG TOUR OFFICIAL LOGO.png" alt="Urban Gang Tour" /></div><div class="mark handle">@URBAN_NEWSGANG</div>
          <div class="mark ugt"><img src="../uploads/URBAN GANG TOUR OFFICIAL LOGO.png" alt="Urban Gang Tour" /></div><div class="mark handle">@URBAN_NEWSGANG</div><div class="mark ppp"><span><img src="../assets/partners/ppp-tv.png" alt="PPP TV" /></span></div><div class="mark ugt"><img src="../uploads/URBAN GANG TOUR OFFICIAL LOGO.png" alt="Urban Gang Tour" /></div><div class="mark ppp"><span><img src="../assets/partners/ppp-tv.png" alt="PPP TV" /></span></div>
          <div class="mark ppp"><span><img src="../assets/partners/ppp-tv.png" alt="PPP TV" /></span></div><div class="mark ugt"><img src="../uploads/URBAN GANG TOUR OFFICIAL LOGO.png" alt="Urban Gang Tour" /></div><div class="mark handle">@URBAN_NEWSGANG</div><div class="mark ugt"><img src="../uploads/URBAN GANG TOUR OFFICIAL LOGO.png" alt="Urban Gang Tour" /></div><div class="mark ppp"><span><img src="../assets/partners/ppp-tv.png" alt="PPP TV" /></span></div>
        </div>
        <footer class="bottom"><div class="stripe"></div><div class="partners"><img src="../assets/partners/xp-hub.png" alt="Experience Hub" /><img src="../assets/partners/synapse.png" alt="Synapse Models" /><img src="../assets/partners/moyo.png" alt="Moyo Response" /><img src="../assets/partners/ashton.png" alt="Ashton Sounds" /><b>URBANGANGTOUR.CO.KE</b></div></footer>
      </section>
      <div class="legs"><span></span><span></span></div>
      <p class="caption">Press media wall · 3m × 2.25m · Safe-margin logo grid for photos, partners and school events</p>
    </main>
  </body>
</html>

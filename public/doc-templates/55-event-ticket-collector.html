<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{margin:0;background:#121019;font-family:Arial,Helvetica,sans-serif}body{padding:28px;box-sizing:border-box}@media print{body{padding:0;background:#fff}}.ticket{width:980px;height:356px;position:relative;overflow:hidden;display:grid;grid-template-columns:1fr 278px;background:#16121b;color:#fff;box-shadow:0 18px 48px #0009}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.3;filter:saturate(1.1)}.wash{position:absolute;inset:0;background:linear-gradient(90deg,#17121bd9 0%,#17121bf0 60%,#f900b599 100%)}.main{position:relative;padding:28px 31px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:15px}.logo{width:124px;height:auto}.admit{font-size:8px;letter-spacing:.15em;text-transform:uppercase;font-weight:900;color:#20c9e4}.tier{margin-left:auto;background:#ffd523;color:#18151b;border:1.5px solid #fff;padding:8px 11px;font-size:9px;font-weight:950;letter-spacing:.11em;text-transform:uppercase}.title{font-size:42px;line-height:.88;letter-spacing:-.055em;text-transform:uppercase;font-weight:950;margin:34px 0 0;max-width:560px;text-shadow:3px 3px 0 #f900b5}.details{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}.detail{border:1px solid #fff9;padding:7px 9px;font-size:8px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.detail.pink{background:#f900b5;border-color:#f900b5}.stub{position:relative;border-left:2px dashed #fff9;padding:24px 23px;display:flex;flex-direction:column;align-items:center;text-align:center;background:#20142299}.stub-ey{font-size:8px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#ffd523}.qr{width:116px;height:116px;background:#fff;padding:6px;box-sizing:border-box;margin:15px 0 12px}.serial{font-size:17px;font-weight:950;letter-spacing:.04em}.stub-note{font-size:8px;line-height:1.45;font-weight:800;margin-top:9px;color:#fff}.tear{position:absolute;left:-7px;top:0;bottom:0;width:12px;background:radial-gradient(circle at 0 12px,#121019 7px,transparent 7.5px) 0 0/12px 24px repeat-y}
</style></head><body>
<main class="ticket" data-doc-page="tix"><img class="art" src="../assets/doc-art/access/gate-security-v1.png" alt=""><div class="wash"></div><section class="main"><div class="brand"><img class="logo" src="../uploads/URBAN GANG TOUR OFFICIAL LOGO.png" alt="Urban Gang Tour"><span class="admit">Official admission</span><span class="tier" data-field="tier" data-tier-gold="1" style="background:#ffd523;color:#18151b"></span></div><h1 class="title" data-field="eventName"></h1><div class="details"><span class="detail" data-field="date"></span><span class="detail" data-field="venue"></span><span class="detail pink" data-field="gateTime"></span></div></section><aside class="stub" data-tier-gold="1" style="border-top:8px solid #FFD400"><div class="tear"></div><div class="stub-ey">Keep this stub</div><div class="qr" data-qr-slot="1"></div><div class="serial" data-field="serialTag"></div><div class="stub-note">ONE ENTRY · VERIFY AT GATE<br>urbangangtour.co.ke</div></aside></main>
</body></html>

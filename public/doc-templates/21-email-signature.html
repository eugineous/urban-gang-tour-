<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UGT — email signature</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Bungee&family=Permanent+Marker&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #1a0c13;
        font-family: "Space Grotesk", sans-serif;
        color: #fff;
      }
      body {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 34px;
        box-sizing: border-box;
      }
      a {
        color: #ffd400;
        text-decoration: none;
      }
      @media print {
        body {
          background: #fff;
          padding: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="2u" data-doc-page="promo">
      <div
        style="
          width: 640px;
          background: #111;
          border-radius: 16px;
          overflow: hidden;
          box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
          position: relative;
        "
      >
        <div
          style="
            position: absolute;
            inset: 0;
            background-image: url(&quot;../assets/pattern.png&quot;);
            background-size: 300px;
            opacity: 0.45;
          "
        ></div>
        <div
          style="
            position: absolute;
            top: -20px;
            right: 110px;
            font-family: &quot;Permanent Marker&quot;;
            font-size: 90px;
            color: rgba(230, 33, 140, 0.18);
            transform: rotate(8deg);
          "
        >
          ug
        </div>
        <div
          style="
            position: relative;
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 22px 26px 18px;
          "
        >
          <div style="position: relative; flex: none">
            <img
              data-hero-slot="0"
              src="../assets/crew/lucy-ogunde.jpg"
              alt="Team member"
              style="
                width: 96px;
                height: 96px;
                border-radius: 50%;
                object-fit: cover;
                object-position: 50% 8%;
                border: 4px solid #e6218c;
                display: block;
              "
            />
            <div
              style="
                position: absolute;
                bottom: -6px;
                right: -10px;
                background: #ffd400;
                color: #111;
                font-family: &quot;Bungee&quot;;
                font-size: 6px;
                letter-spacing: 0.08em;
                padding: 4px 8px;
                border-radius: 100px;
                border: 2px solid #111;
                transform: rotate(-4deg);
              "
            >
              ON AIR
            </div>
          </div>
          <div style="flex: 1">
            <div
              style="
                font-family: &quot;Anton&quot;;
                font-size: 24px;
                color: #fff;
                text-transform: uppercase;
                line-height: 1;
              "
                data-field="name"
              >ALEX MUGO</div>
            <div
              style="
                font-family: &quot;Bungee&quot;;
                font-size: 7.5px;
                letter-spacing: 0.14em;
                color: #21c7e6;
                margin-top: 5px;
              "
                data-field="role"
              >PARTNERSHIPS · URBAN GANG TOUR</div>
            <div
              style="
                display: flex;
                flex-wrap: wrap;
                gap: 4px 16px;
                margin-top: 10px;
                font-size: 11.5px;
                font-weight: 600;
                color: #ddd;
              "
            >
              <span data-field="phone">+254 700 000 000</span
              ><span style="color: #e6218c; font-weight: 700" data-field="email"
                >hello@urbangangtour.co.ke</span
              ><span data-field="website">urbangangtour.co.ke</span
              ><span style="color: #21c7e6; font-weight: 700" data-field="handle"
                >@urban_newsgang</span
              >
            </div>
          </div>
          <img
            src="../uploads/URBAN GANG TOUR OFFICIAL LOGO.png"
            alt="Urban Gang Tour"
            style="
              height: 66px;
              width: auto;
              transform: rotate(-3deg);
              filter: drop-shadow(3px 3px 0 rgba(0, 0, 0, 0.5));
            "
          />
        </div>
        <div
          style="
            position: relative;
            background: #e6218c;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 26px;
          "
        >
          <span
            style="
              font-family: &quot;Bungee&quot;;
              font-size: 8px;
              letter-spacing: 0.12em;
              color: #fff;
            "
            data-field="cta"
            >BOOK THE TOUR · PARTNER WITH US</span
          >
          <span
            style="
              font-family: &quot;Permanent Marker&quot;;
              font-size: 12px;
              color: #ffd400;
            "
            >from potential to purpose</span
          >
        </div>
        <div style="display: flex; height: 6px">
          <span style="flex: 2; background: #ffd400"></span
          ><span style="flex: 1; background: #21c7e6"></span
          ><span style="flex: 1; background: #fff"></span>
        </div>
      </div>
    </div>
  </body>
</html>

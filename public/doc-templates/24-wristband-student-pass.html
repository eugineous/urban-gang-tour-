<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UGT — wristband student pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bungee&family=Permanent+Marker&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#1a0c13;font-family:"Space Grotesk",sans-serif;color:#fff;}
body{display:flex;align-items:flex-start;justify-content:center;padding:34px;box-sizing:border-box;}
a{color:#FFD400;text-decoration:none;}
@media print{body{background:#fff;padding:0;}}
</style>
</head>
<body>
<div id="3i">
      
      <div style="width:960px;height:96px;position:relative;transform:rotate(-.4deg);">
        <div style="position:absolute;inset:0;background:radial-gradient(circle at 18% 30%,#ff3d9e 0%,#E6218C 55%,#b0135e 100%);border-radius:10px;overflow:hidden;box-shadow:0 12px 28px rgba(0,0,0,.5);display:flex;align-items:center;">
          <div style="position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.13) 1.3px,transparent 1.3px);background-size:12px 12px;"></div>
          <div style="position:absolute;top:-15px;left:220px;font-family:'Permanent Marker';font-size:62px;color:rgba(255,255,255,.13);transform:rotate(-3deg);white-space:nowrap;">the whole day, one band</div>
          <div style="width:120px;height:100%;background:#111;display:flex;align-items:center;justify-content:center;flex:none;clip-path:polygon(0 0,100% 0,88% 50%,100% 100%,0 100%);position:relative;">
            <img src="../uploads/URBAN GANG TOUR OFFICIAL LOGO.png" alt="UGT" style="height:58px;width:auto;margin-right:10px;">
          </div>
          <div style="flex:1;padding:0 18px;min-width:0;position:relative;display:flex;align-items:center;gap:16px;">
            <div>
              <div style="font-family:'Anton';font-size:28px;text-transform:uppercase;color:#fff;line-height:1;text-shadow:2px 2px 0 #111;">Student Pass</div>
              <div style="display:flex;gap:8px;align-items:baseline;font-family:'Bungee';font-size:7px;letter-spacing:.12em;color:#FFD400;margin-top:4px;">SCHOOL:<span style="width:120px;border-bottom:2px dotted rgba(255,255,255,.65);height:9px;"></span>DATE:<span style="width:64px;border-bottom:2px dotted rgba(255,255,255,.65);height:9px;"></span></div>
            </div>
            <div style="font-family:'Permanent Marker';font-size:15px;color:#fff;transform:rotate(-2deg);opacity:.95;">show, pods, games, crowning — you're in.</div>
          </div>
          <div style="display:flex;align-items:center;gap:14px;padding:0 16px;flex:none;position:relative;">
            <span style="background:#FFD400;color:#111;font-family:'Bungee';font-size:8.5px;letter-spacing:.1em;padding:7px 13px;border-radius:100px;border:2px solid #111;transform:rotate(2deg);">ONE TIER</span>
            <div style="height:96px;border-left:3px dashed rgba(255,255,255,.5);"></div>
            <div style="font-family:monospace;font-size:8.5px;color:#fff;letter-spacing:.1em;writing-mode:vertical-rl;transform:rotate(180deg);">Nº ______</div>
            <div style="width:64px;height:52px;background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 4px,#fff 4px 5px,transparent 5px 9px,#fff 9px 12px,transparent 12px 14px);"></div>
            <div style="display:flex;flex-direction:column;gap:9px;"><span style="width:12px;height:12px;border-radius:50%;background:#8e0e4c;border:2px solid #fff;"></span><span style="width:12px;height:12px;border-radius:50%;background:#8e0e4c;border:2px solid #fff;"></span></div>
          </div>
        </div>
      </div>
    </div>
</body>
</html>

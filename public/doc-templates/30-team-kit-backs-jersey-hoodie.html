<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UGT — team kit backs jersey hoodie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Bungee&family=Permanent+Marker&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #1a0c13;
        font-family: "Space Grotesk", sans-serif;
        color: #fff;
      }
      body {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 34px;
        box-sizing: border-box;
      }
      a {
        color: #ffd400;
        text-decoration: none;
      }
      @media print {
        body {
          background: #fff;
          padding: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="3h" data-doc-page="promo">
      <div style="display: flex; gap: 44px; align-items: flex-end">
        <!-- jersey back black -->
        <div style="position: relative; width: 400px">
          <div
            style="
              width: 400px;
              height: 480px;
              background: linear-gradient(180deg, #161616, #0d0d0d);
              clip-path: polygon(
                18% 0,
                32% 5%,
                50% 7%,
                68% 5%,
                82% 0,
                100% 9%,
                94% 26%,
                88% 24%,
                88% 100%,
                12% 100%,
                12% 24%,
                6% 26%,
                0 9%
              );
              position: relative;
              overflow: hidden;
              box-shadow: 0 20px 44px rgba(0, 0, 0, 0.55);
            "
          >
            <div
              style="
                position: absolute;
                inset: 0;
                background-image: radial-gradient(
                  circle,
                  rgba(255, 255, 255, 0.05) 1.5px,
                  transparent 1.5px
                );
                background-size: 9px 9px;
              "
            ></div>
            <div
              data-field="jerseyName"
              style="
                position: absolute;
                left: 0;
                right: 0;
                top: 34px;
                text-align: center;
                font-family: &quot;Anton&quot;;
                font-size: 34px;
                letter-spacing: 0.14em;
                color: #fff;
                text-transform: uppercase;
              "
            >
              OGUNDE
            </div>
            <div
              data-field="jerseyNumber"
              style="
                position: absolute;
                left: 0;
                right: 0;
                top: 76px;
                text-align: center;
                font-family: &quot;Anton&quot;;
                font-size: 170px;
                line-height: 1;
                color: #e6218c;
                text-shadow: 6px 6px 0 #ffd400;
              "
            >
              01
            </div>
            <div
              style="
                position: absolute;
                left: 0;
                right: 0;
                top: 266px;
                display: flex;
                justify-content: center;
              "
            >
              <img
                src="../uploads/URBAN GANG TOUR OFFICIAL LOGO.png"

                  height: 86px;
                  width: auto;

              />
            </div>
            <div
              style="
                position: absolute;
                left: 0;
                right: 0;
                top: 362px;
                text-align: center;
              "

              <span
                style="
                  background: #ffd400;
                  color: #111;
                  font-family: &quot;Bungee&quot;;
                  font-size: 7.5px;
                  letter-spacing: 0.16em;
                  padding: 6px 13px;
                  border-radius: 100px;
                "
                >FROM POTENTIAL TO PURPOSE</span
              >
            </div>
            <div
              style="
                position: absolute;
                left: 0;
                right: 0;
                bottom: 14px;
                text-align: center;
                font-family: &quot;Bungee&quot;;
                font-size: 7px;
                letter-spacing: 0.24em;
                color: #555;
              "
            >
              URBAN GANG TOUR · EST. NBO
            </div>
            <div
              style="
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;

                  #e6218c 0 30px,
                  #ffd400 30px 60px,
                  #21c7e6 60px 90px
                );
                opacity: 0.85;
              "
            ></div>
            <div
              style="
                position: absolute;
                right: 0;
                top: 0;
                bottom: 0;
                width: 14px;

                  #e6218c 0 30px,
                  #ffd400 30px 60px,
                  #21c7e6 60px 90px
                );
                opacity: 0.85;
              "
            ></div>
          </div>

              background: radial-gradient(

                #c4157c 70%

              clip-path: polygon(
                16% 0,
                34% 4%,

                  circle,
                  rgba(255, 255, 255, 0.08) 1.5px,
                  transparent 1.5px

                background-size: 10px 10px;

            <div

                left: 24px;
                top: 24px;
                font-family: &quot;Permanent Marker&quot;;
                font-size: 64px;
                color: rgba(255, 255, 255, 0.14);
                transform: rotate(-8deg);
              "
            >
              gang
            </div>
            <div
              style="
                position: absolute;
                left: 0;
                right: 0;
                top: 44px;
                text-align: center;
              "
            >
              <span
                data-field="hoodieName"
                style="
                  background: #111;
                  color: #fff;
                  font-family: &quot;Anton&quot;;
                  font-size: 30px;
                  letter-spacing: 0.12em;
                  text-transform: uppercase;
                  padding: 4px 22px 7px;
                  transform: rotate(-1.5deg);
                  display: inline-block;
                  box-shadow: 4px 4px 0 #ffd400;

            </div>
            <div

                position: absolute;

                font-family: &quot;Anton&quot;;
                font-size: 150px;
                line-height: 1;
                color: #ffd400;
                text-shadow: 6px 6px 0 #111;

                position: absolute;
                left: 0;

                top: 282px;

                font-family: &quot;Permanent Marker&quot;;

                right: 0;

                align-items: center;
                justify-content: center;

            >
              <span
                style="
                  font-family: &quot;Bungee&quot;;
                  font-size: 7px;
                  letter-spacing: 0.26em;
                  color: #ffd400;

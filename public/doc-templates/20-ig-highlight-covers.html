<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UGT — Instagram highlight cover kit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #131119; font-family: "Space Grotesk", Arial, sans-serif; color: #fff; }
      body { min-height: 100vh; display: grid; place-items: center; padding: 34px; }
      .sheet { width: 980px; padding: 32px; border: 1px solid #ffffff2e; border-radius: 24px; background: radial-gradient(circle at 7% 11%, #f900b533, transparent 20%), #19161f; }
      .masthead { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
      .masthead img { width: 125px; height: auto; }
      .masthead p { margin: 0; max-width: 330px; color: #ffffffaa; font-size: 12px; line-height: 1.45; text-align: right; }
      .covers { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
      .cover-wrap { text-align: center; }
      .cover { aspect-ratio: 1; border-radius: 50%; overflow: hidden; position: relative; display: grid; place-items: center; border: 4px solid var(--accent); background: var(--bg); box-shadow: 0 8px 0 #08070b, 0 14px 26px #0007; }
      .cover::before { content: ""; position: absolute; inset: 10px; border: 1px solid #fff8; border-radius: 50%; }
      .cover::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 70% 18%, #fff5 0 7%, transparent 8%), repeating-linear-gradient(135deg, transparent 0 11px, #ffffff15 12px 13px); mix-blend-mode: screen; }
      .cover .word { z-index: 1; max-width: 76%; font-family: Anton, Impact, sans-serif; font-size: 25px; line-height: .87; letter-spacing: -.03em; text-transform: uppercase; text-shadow: 2px 3px 0 #111; }
      .cover img { z-index: 2; position: absolute; width: 54px; height: auto; bottom: 13px; filter: drop-shadow(2px 3px 0 #1118); }
      .cover-wrap small { display: block; margin-top: 12px; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #fff; }
      .talent { --accent: #f900b5; --bg: linear-gradient(145deg, #f900b5, #57113f); }
      .schools { --accent: #ffd523; --bg: linear-gradient(145deg, #ffd523, #c56b00); color: #17121b; }
      .schools .word { text-shadow: 2px 3px 0 #fff8; }
      .awards { --accent: #20c9e4; --bg: linear-gradient(145deg, #20c9e4, #2453b8); }
      .bts { --accent: #fff; --bg: linear-gradient(145deg, #3a3440, #09090d); }
      .merch { --accent: #f900b5; --bg: linear-gradient(145deg, #c61b51, #f900b5); }
      .hype { --accent: #ffd523; --bg: linear-gradient(145deg, #4129a4, #15101c); }
      @media print { body { padding: 0; background: #fff; } .sheet { border-radius: 0; box-shadow: none; } }
    </style>
  </head>
  <body>
    <main class="sheet">
      <header class="masthead">
        <img src="../uploads/URBAN GANG TOUR OFFICIAL LOGO.png" alt="Urban Gang Tour" />
        <p>Instagram Highlight Cover Kit · six reusable covers for the moments fans, schools and partners need to find fast.</p>
      </header>
      <section class="covers" aria-label="Instagram highlight covers">
        <div class="cover-wrap"><div class="cover talent"><span class="word">Talent</span><img src="../uploads/URBAN GANG TOUR OFFICIAL LOGO.png" alt="" /></div><small>Talent</small></div>
        <div class="cover-wrap"><div class="cover schools"><span class="word">Schools</span><img src="../uploads/URBAN GANG TOUR OFFICIAL LOGO.png" alt="" /></div><small>Schools</small></div>
        <div class="cover-wrap"><div class="cover awards"><span class="word">Awards</span><img src="../uploads/URBAN GANG TOUR OFFICIAL LOGO.png" alt="" /></div><small>Awards</small></div>
        <div class="cover-wrap"><div class="cover bts"><span class="word">Behind<br />the scenes</span><img src="../uploads/URBAN GANG TOUR OFFICIAL LOGO.png" alt="" /></div><small>Behind the scenes</small></div>
        <div class="cover-wrap"><div class="cover merch"><span class="word">Merch</span><img src="../uploads/URBAN GANG TOUR OFFICIAL LOGO.png" alt="" /></div><small>Merch</small></div>
        <div class="cover-wrap"><div class="cover hype"><span class="word">Hype</span><img src="../uploads/URBAN GANG TOUR OFFICIAL LOGO.png" alt="" /></div><small>Hype</small></div>
      </section>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>UGT — poster festival of colours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bungee&family=Permanent+Marker&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#1a0c13;font-family:"Space Grotesk",sans-serif;color:#fff;}

@media print{body{background:#fff;padding:0;}}
</style>
</head>
<body>
<div id="4c">

        <div style="position:absolute;left:-90px;top:-70px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(230,33,140,.75) 0%,rgba(230,33,140,0) 70%);filter:blur(6px);"></div>

          <div style="font-family:'Bungee';font-size:7.5px;letter-spacing:.14em;margin-top:2px;">SEPT</div>

        <div style="position:absolute;left:0;right:0;top:170px;display:flex;flex-direction:column;align-items:center;z-index:3;">

        </div>
        <div style="position:absolute;left:0;right:0;bottom:0;background:#111;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;z-index:4;">

          <span style="font-family:'Bungee';font-size:8px;letter-spacing:.14em;color:#21C7E6;">@URBAN_NEWSGANG</span>

</html>

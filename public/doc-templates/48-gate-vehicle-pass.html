<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:#0e1018;font-family:Arial,Helvetica,sans-serif}body{padding:24px}.pass{width:640px;height:440px;position:relative;overflow:hidden;background:#0c121d;color:#fff;box-shadow:0 20px 50px #0008}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.42}.wash{position:absolute;inset:0;background:linear-gradient(125deg,#0b111bee,#0b111bc0)}.inside{position:relative;z-index:2;padding:28px;height:100%;display:grid;grid-template-columns:1fr 150px;gap:18px}.logo{width:96px}.ey{margin-top:16px;color:#f7d21b;font-size:8px;letter-spacing:.16em;text-transform:uppercase;font-weight:900}.title{font-size:34px;line-height:.86;letter-spacing:-.06em;text-transform:uppercase;margin:9px 0;font-weight:950}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.field{border:1px solid #f7d21b;background:#0b101ad7;border-radius:5px;padding:7px}.field b{display:block;color:#f7d21b;font-size:6px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}.field [data-field]{display:block;min-height:13px;font-size:11px;font-weight:800}.side{border-left:2px dashed #f7d21b;padding-left:17px;display:flex;flex-direction:column}.qr{width:105px;height:105px;background:#fff;border-radius:5px;padding:6px;margin-top:auto}.qr img{width:100%;height:100%;object-fit:contain}.serial{font-size:7px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;margin-top:9px}.bar{position:absolute;bottom:0;left:0;right:0;height:7px;display:flex}.bar i{flex:1}</style></head><body><main class="pass" data-doc-page="pass"><img class="art" src="../assets/doc-art/access/gate-security-v1.png" alt=""><div class="wash"></div><div class="inside"><section><img class="logo" src="../uploads/URBAN GANG TOUR OFFICIAL LOGO.png" alt="Urban Gang Tour"><div class="ey">Authorised vehicle access</div><h1 class="title">Gate pass</h1><div class="fields"><div class="field" style="grid-column:span 2"><b>Vehicle registration</b><div data-field="vehicleReg" style="font-size:19px"></div></div><div class="field"><b>Driver</b><div data-field="driver"></div></div><div class="field"><b>Event</b><div data-field="event"></div></div><div class="field"><b>Date</b><div data-field="date"></div></div><div class="field"><b>Pass number</b><div data-field="passNo"></div></div></div></section><aside class="side"><div class="ey" style="margin-top:0">Scan at gate</div><div class="qr" data-qr-slot="1"></div><div class="serial">Display on dashboard<br>or present to gate team</div></aside></div><div class="bar"><i style="background:#f900b5"></i><i style="background:#f7d21b"></i><i style="background:#20c9e4"></i></div></main></body></html>

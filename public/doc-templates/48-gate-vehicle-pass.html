<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UGT — gate vehicle pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bungee&family=Permanent+Marker&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#1a0c13;font-family:"Space Grotesk",sans-serif;color:#fff;}
body{display:flex;align-items:flex-start;justify-content:center;padding:34px;box-sizing:border-box;}
a{color:#FFD400;text-decoration:none;}
@media print{body{background:#fff;padding:0;}}
</style>
</head>
<body>
<div id="5e">
      
      <div style="display:flex;flex-direction:column;gap:26px;">
        <div style="width:640px;height:440px;position:relative;transform:rotate(-.6deg);">
          <div style="position:absolute;inset:0;border-radius:16px;overflow:hidden;background:#111;box-shadow:0 16px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;">
            <div style="position:absolute;inset:0;background-image:url('../assets/pattern.png');background-size:280px;opacity:.5;"></div>
            <div style="position:relative;background:repeating-linear-gradient(45deg,#FFD400 0 16px,#111 16px 32px);padding:5px;">
              <div style="background:#111;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-radius:6px;">
                <img src="../uploads/URBAN GANG TOUR OFFICIAL LOGO.png" alt="" style="height:44px;width:auto;">
                <div style="font-family:'Anton';font-size:30px;color:#FFD400;text-transform:uppercase;letter-spacing:.04em;">Gate Pass</div>
                <div style="font-family:monospace;font-size:9px;color:#999;letter-spacing:.14em;">Nº V-____</div>
              </div>
            </div>
            <div style="position:relative;flex:1;padding:18px 24px;display:flex;flex-direction:column;gap:13px;color:#fff;font-size:12.5px;font-weight:600;">
              <div style="display:flex;gap:24px;">
                <div style="display:flex;align-items:baseline;gap:8px;flex:1.2;">Vehicle Reg:<span style="flex:1;border-bottom:2.5px dotted rgba(255,255,255,.5);height:15px;"></span></div>
                <div style="display:flex;align-items:baseline;gap:8px;flex:1;">Driver:<span style="flex:1;border-bottom:2.5px dotted rgba(255,255,255,.5);height:15px;"></span></div>
              </div>
              <div style="display:flex;gap:24px;">
                <div style="display:flex;align-items:baseline;gap:8px;flex:1.2;">Event / Stop:<span style="flex:1;border-bottom:2.5px dotted rgba(255,255,255,.5);height:15px;"></span></div>
                <div style="display:flex;align-items:baseline;gap:8px;flex:1;">Date:<span style="flex:1;border-bottom:2.5px dotted rgba(255,255,255,.5);height:15px;"></span></div>
              </div>
              <div style="display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap;">
                <span style="font-family:'Bungee';font-size:8px;letter-spacing:.12em;color:#21C7E6;">ZONE →</span>
                <span style="background:#E6218C;color:#fff;font-family:'Bungee';font-size:8.5px;letter-spacing:.1em;padding:8px 15px;border-radius:8px;border:2px solid #fff;display:flex;align-items:center;gap:8px;"><span style="width:14px;height:14px;border:2.5px solid #fff;border-radius:4px;"></span>STAGE / CREW</span>
                <span style="background:#21C7E6;color:#111;font-family:'Bungee';font-size:8.5px;letter-spacing:.1em;padding:8px 15px;border-radius:8px;border:2px solid #111;display:flex;align-items:center;gap:8px;"><span style="width:14px;height:14px;border:2.5px solid #111;border-radius:4px;"></span>MEDIA</span>
                <span style="background:#FFD400;color:#111;font-family:'Bungee';font-size:8.5px;letter-spacing:.1em;padding:8px 15px;border-radius:8px;border:2px solid #111;display:flex;align-items:center;gap:8px;"><span style="width:14px;height:14px;border:2.5px solid #111;border-radius:4px;"></span>VIP / GUESTS</span>
                <span style="background:#fff;color:#111;font-family:'Bungee';font-size:8.5px;letter-spacing:.1em;padding:8px 15px;border-radius:8px;border:2px solid #111;display:flex;align-items:center;gap:8px;"><span style="width:14px;height:14px;border:2.5px solid #111;border-radius:4px;"></span>VENDOR</span>
              </div>
              <div style="margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;">
                <div style="font-size:10px;color:#bbb;line-height:1.6;max-width:340px;">Display face-up on the dashboard · valid only for the date shown · gate team may redirect parking on the day — smile and comply, it's for the show.</div>
                <div style="width:110px;height:34px;background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 4px,#fff 4px 5px,transparent 5px 9px);opacity:.85;"></div>
              </div>
            </div>
            <div style="display:flex;height:9px;"><span style="flex:2;background:#E6218C;"></span><span style="flex:1;background:#FFD400;"></span><span style="flex:1;background:#21C7E6;"></span></div>
          </div>
        </div>

        <!-- 5f THANK YOU LETTER -->
        
      </div>
    </div>
</body>
</html>

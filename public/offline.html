<!doctype html>
<html lang="en-KE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f0e8">
  <meta name="robots" content="noindex">
  <title>You’re offline. | Urban Gang Tour</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f0e8;color:#151515;font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(760px,calc(100% - 40px));margin:auto;padding:clamp(40px,12vh,120px) 0 64px}
    .brand{display:block;font-size:18px;font-weight:750;letter-spacing:-.04em;margin-bottom:64px}
    .brand::before{content:"";display:inline-block;width:10px;height:10px;margin-right:10px;border-radius:50%;background:#ad1264}
    .label{color:#790c46;font-size:13px;font-weight:650;letter-spacing:.08em;text-transform:uppercase}
    h1{font-size:clamp(36px,7vw,64px);font-weight:650;line-height:1.1;letter-spacing:-.055em;margin:16px 0 24px;overflow-wrap:anywhere}
    .description{max-width:590px;margin:0;color:#57534e;font-size:18px}
    nav{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;min-width:44px;max-width:100%;padding:10px 20px;border:1px solid #151515;border-radius:999px;color:#151515;font-weight:600;text-decoration:none;overflow-wrap:anywhere}
    .retry{background:#ad1264;border-color:#ad1264;color:#fff}
    a:hover{text-decoration:underline;text-underline-offset:4px}
    a:focus-visible{outline:3px solid #151515;outline-offset:4px}
    @media(max-width:400px){main{width:calc(100% - 32px)}.brand{margin-bottom:48px}}
  </style>
</head>
<body>
  <main>
    <span class="brand">Urban Gang Tour</span>
    <p class="label" id="offline-label">Connection interrupted</p>
    <h1 id="offline-title">You’re offline.</h1>
    <p class="description" id="offline-description">Check your connection, then try again. Payment and ticket validity still need server confirmation.</p>
    <nav aria-label="Offline navigation">
      <a class="retry" id="offline-retry" href="/">Try again</a>
      <a id="offline-app" href="/app">Get the app</a>
    </nav>
  </main>
  <script>
    // Optional enhancement only: native English links work without this script.
    (() => {
      try {
        const saved = localStorage.getItem('ugt-interface-language-v1');
        const messages = {
          en: ['Connection interrupted', 'You’re offline.', 'Check your connection, then try again. Payment and ticket validity still need server confirmation.', 'Try again', 'Get the app', 'Offline navigation'],
          sw: ['Muunganisho umekatika', 'Hujaunganishwa mtandaoni.', 'Angalia muunganisho wako, kisha ujaribu tena. Malipo na uhalali wa tiketi bado vinahitaji uthibitisho wa seva.', 'Jaribu tena', 'Pata programu', 'Urambazaji bila mtandao'],
          fr: ['Connexion interrompue', 'Vous êtes hors ligne.', 'Vérifiez votre connexion, puis réessayez. Le paiement et la validité des billets nécessitent toujours une confirmation du serveur.', 'Réessayer', 'Obtenir l’application', 'Navigation hors ligne'],
          'zh-Hans': ['连接中断', '您已离线。', '请检查网络连接后重试。付款与门票有效性仍需服务器确认。', '重试', '获取应用', '离线导航'],
          ru: ['Соединение прервано', 'Вы не в сети.', 'Проверьте соединение и повторите попытку. Оплата и действительность билетов по-прежнему требуют подтверждения сервера.', 'Повторить', 'Получить приложение', 'Навигация без сети'],
          es: ['Conexión interrumpida', 'No tienes conexión.', 'Comprueba tu conexión e inténtalo de nuevo. El pago y la validez de las entradas siguen necesitando confirmación del servidor.', 'Reintentar', 'Obtener la aplicación', 'Navegación sin conexión']
        };
        if (!Object.prototype.hasOwnProperty.call(messages, saved)) return;
        const copy = messages[saved];
        ['label', 'title', 'description', 'retry', 'app'].forEach((key, index) => {document.getElementById('offline-' + key).textContent = copy[index];});
        document.querySelector('nav').setAttribute('aria-label', copy[5]);
        document.documentElement.lang = saved === 'en' ? 'en-KE' : saved;
        document.title = copy[1] + ' | Urban Gang Tour';
      } catch {}
    })();
  </script>
</body>
</html>
